              desc: p.description || p.argumentHint || "prompt template",
              insert: `/${p.name}`,
              score: s,
            });
          }
          scored.sort((a, b) => b.score - a.score);
          items = scored.slice(0, COMPLETION_LIMIT);
          title = "Commands";
          empty = catalog.error
            ? "Command list unavailable"
            : commands.length || prompts.length ? "No matching command" : "No commands configured";
        } else {
          completedScope = api.scope || mentionScope(ctx.trigger);
          const data = await loadMentions(completedScope);
          const mentions = data.mentions || [];
          const matched = rank(mentions, ctx.query,
            (m) => [m.label, m.dir, m.groupName || "", m.id]);
          items = matched.slice(0, COMPLETION_LIMIT).map((m) => ({
            name: m.label,
            desc: [m.dir, m.groupName, ago(m.modified)].filter(Boolean).join(" · "),
            insert: m.value,
            value: m.value,
          }));
          title = "Sessions";
          // `@g[` on an ungrouped session returns no rows on purpose; say why.
          empty = data.error
            ? "Session list unavailable"
            : mentions.length ? "No matching session"
            : completedScope.startsWith("group") && !data.fromGroup
              ? "This session is ungrouped — pick a group or All sessions"
              : completedScope.startsWith("group")
                ? "No other sessions in this group"
                : "No other sessions";
        }

        if (seq !== api.seq) return; // a newer keystroke won
        api.items = items;
        api.index = 0;
        // `render` needs the scope the rows were fetched for, so the dropdown
        // shows the applied filter rather than the trigger that started it.
        api.render(items, title, empty, ctx, completedScope);
      },

      render(items, title, empty, ctx, completedScope) {
        if (!pop) return;
        pop.textContent = "";
        pop.classList.remove("hidden");

        const head = el("div", "head");
        head.append(el("span", null, title));
        const where = el("span", "scope");
        if (ctx.kind === "mention") {
          where.textContent = title === "Sessions" ? "@" : "";
          head.append(where);
          // Pick the group filter (`@g[` in the TUI) without retyping the token.
          const sel = el("select");
          sel.append(new Option("This group", "group"));
          sel.append(new Option("This group + archived", "group-archived"));
          sel.append(new Option("All sessions", "all"));
          const groups = store.mentions?.groups || [];
          for (const g of groups) sel.append(new Option(g.name, g.id));
          sel.value = completedScope || mentionScope(ctx.trigger);
          sel.onchange = async () => {
            api.scope = sel.value;
            await api.update();
          };
          head.append(sel);
        } else {
          where.textContent = items.length ? `${items.length} match` : empty;
          head.append(where);
        }
        pop.append(head);

        const list = el("div", "items");
        if (!items.length) {
          list.append(el("div", "item none", empty));
        }
        const rows = [];
        items.forEach((item, i) => {
          const n = el("div", "item" + (i === api.index ? " sel" : ""));
          n.append(el("span", "name", item.name));
          if (item.desc) n.append(el("span", "desc", item.desc));
          // mousedown, not click: the textarea must not lose the caret and the
          // whole popup is rebuilt on the next keystroke.
          n.addEventListener("mousedown", (e) => {
            e.preventDefault();
            api.choose(i);
          });
          list.append(n);
          rows.push(n);
        });
        api.rows = rows;
        pop.append(list);

        // A failed/slow catalog is worth one line of explanation, not a popup.
        if (!items.length && ctx.kind !== "mention") {
          setTimeout(() => { if (api.ctx === ctx) api.close(); }, 1400);
        }
      },

      move(delta) {
        if (!api.items.length) return;
        const n = api.items.length;
        api.index = (api.index + delta + n) % n;
        (api.rows || []).forEach((n2, i) => {
          n2.classList.toggle("sel", i === api.index);
        });
        const sel = (api.rows || [])[api.index];
        if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest" });
      },

      choose(index = api.index) {
        const item = api.items[index];
        const ctx = api.ctx;
        if (!item || !ctx) return;
        if (item.warn) {
          toast("Interactive-only command: it will run here but do nothing", 4200);
        }
        applyCompletion(box, ctx, item.insert);
        api.close();
      },
    };
    return api;
  }

  /** Wire typing, caret moves and the popup's keys to one text box. */
  function attachCompletion(box, pop) {
    const comp = makeCompletion(box, pop);
    const refresh = () => { void comp.update(); };
    // Typing and caret moves keep the popup in step with the token under the
    // caret. `input` covers deletion and pasting too, so the popup cannot be
    // left showing a query it was not built from.
    box.addEventListener("input", refresh);
    box.addEventListener("click", refresh);
    box.addEventListener("keyup", (e) => {
      if (/^(ArrowLeft|ArrowRight|Home|End)$/.test(e.key)) refresh();
    });
    box.addEventListener("blur", () => {
      // Delay so a tap on a popup row still lands (rows use mousedown and
      // preventDefault, but Safari fires blur first on some versions).
      setTimeout(() => {
        if (document.activeElement !== box) comp.close();
      }, 120);
    });
    return comp;
  }

  /**
   * The popup's navigation keys, called first by the owning field's keydown.
   * Returns true when the popup consumed the key.
   */
  function completionKey(comp, e) {
    if (!comp.isOpen() || e.metaKey || e.ctrlKey || e.altKey) return false;
    if (e.key === "ArrowDown") { e.preventDefault(); comp.move(1); return true; }
    if (e.key === "ArrowUp") { e.preventDefault(); comp.move(-1); return true; }
    if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) {
      e.preventDefault();
      comp.choose();
      return true;
    }
    if (e.key === "Escape") { e.preventDefault(); comp.close(); return true; }
    return false;
  }

  /** Replace the token under the caret with `text`, then close the popup. */
  function applyCompletion(box, ctx, text) {
    const before = box.value.slice(0, ctx.start);
    const tail = box.value.slice(ctx.end);
    const needsSpace = !/^[\s\]]/.test(tail);
    const insert = needsSpace ? `${text} ` : text;
    box.value = before + insert + tail;
    const caret = (before + insert).length;
    box.setSelectionRange(caret, caret);
    box.dispatchEvent(new Event("input"));
  }

  const completion = attachCompletion($("#input"), $("#comp"));

  // ── wiring ────────────────────────────────────────────────────────
  $("#back").onclick = close;
  $("#refresh").onclick = refresh;
  $("#newBtn").onclick = newAgent;
  $("#menuBtn").onclick = listMenu;
  $("#moreBtn").onclick = () => { if (store.row) rowMenu(store.row); };
  $("#send").onclick = submit;
  // Enter writes a newline: the Send button is right there, so the return key
  // has no reason to be destructive. Cmd/Ctrl+Enter keeps a keyboard send for
  // a desktop, where reaching for the button is the slower path.
  $("#input").addEventListener("keydown", (e) => {
    // The completion popup owns the navigation keys while it is open, so ↑/↓/Tab
    // pick an entry instead of moving the caret or leaving the field.
    if (completionKey(completion, e)) return;
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
      e.preventDefault();
      submit();
    }
  });
  // Tapping the transcript dismisses the keyboard, so reading back through a
  // long answer does not leave the composer covering half the screen.
  //
  // Pointer events, not click: the transcript is rebuilt on every stream tick,
  // and a rebuild landing mid-press detaches the target so no `click` ever
  // fires. A movement threshold keeps a scroll gesture from blurring instead.
  let tapStart = null;
  $("#log").addEventListener("pointerdown", (e) => {
    tapStart = { x: e.clientX, y: e.clientY };
  });
  window.addEventListener("pointerup", (e) => {
    const start = tapStart;
    tapStart = null;
    if (!start) return;
    if (Math.abs(e.clientX - start.x) > 8 || Math.abs(e.clientY - start.y) > 8)
      return; // a scroll, not a tap
    const log = $("#log");
    if (!log.getBoundingClientRect) return;
    const r = log.getBoundingClientRect();
    const inside =
      e.clientX >= r.left && e.clientX <= r.right &&
      e.clientY >= r.top && e.clientY <= r.bottom;
    if (!inside) return;
    const focused = document.activeElement;
    if (focused && focused.id === "input") focused.blur();
  });
  // A reader scrolled back must not be dragged to the bottom by a stream tick
  // or by the keyboard resizing the viewport.
  $("#log").addEventListener("scroll", () => {
    const log = $("#log");
    store.stickToBottom =
      log.scrollHeight - log.scrollTop - log.clientHeight < 80;
  }, { passive: true });
  $("#input").addEventListener("input", (e) => {
    const n = e.target;
    n.style.height = "auto";
    n.style.height = `${Math.min(n.scrollHeight, window.innerHeight * 0.4)}px`;
  });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopWatch();
    else if (store.id) { watch(store.id); }
    else refresh();
  });

  refresh();
  renderTabs();
  setInterval(() => { if (!store.id) refresh(); }, 4000);
})();
</script>
</body>
</html>
