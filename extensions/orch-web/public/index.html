<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<title>orch</title>
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d10;
    --panel: #14181d;
    --panel-2: #1b2027;
    --line: #262c34;
    --text: #e6e9ee;
    --dim: #8b95a3;
    --accent: #6ea8fe;
    --work: #f0b429;
    --you: #4ade80;
    --unread: #a78bfa;
    --err: #f87171;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.45 -apple-system, system-ui, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overscroll-behavior-y: contain;
  }
  /* While a session is open the overlay owns the viewport; the document behind
     it must not scroll, or a gesture that escapes the transcript drags the
     page (and the composer with it) instead of the transcript. */
  body.detail-open { overflow: hidden; }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button {
    font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 9px;
    padding: 7px 11px; min-height: 36px;
  }
  button:active { background: var(--line); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06101f; font-weight: 600; }
  button.danger { color: var(--err); border-color: #3a2529; }
  button:disabled { opacity: .45; }
  .ghost { background: transparent; border-color: transparent; color: var(--dim); }
  main { padding: 6px 0 90px; }
  .hidden { display: none !important; }

  /* ── list ── */
  .row {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 11px 14px; border-bottom: 1px solid var(--line);
  }
  .row:active { background: var(--panel); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: 0 0 auto;
    background: var(--dim); }
  /* The rules below all have the same specificity, so WHICH STATE WINS IS
     SOURCE ORDER. Ordered least to most urgent:
       your-turn/aborted  -> unread -> working/queued -> error/stalled
     Unread outranks "your turn" and "aborted" because a green ball reads as
     "nothing to do", which is the one thing an unread session is not. A live
     run still wins over unread, since working/queued says it is moving without
     you. Red stays last: an errored or stalled run is the one state that must
     not be quietened by "you have not read this yet". */
  .dot.your-turn { background: var(--you); }
  .dot.aborted { background: var(--dim); }
  .dot.unread { background: var(--unread); }
  .dot.working { background: var(--work); animation: pulse 1.6s infinite; }
  .dot.queued { background: var(--work); opacity: .55; }
  .dot.error, .dot.stalled { background: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }
  .body { flex: 1; min-width: 0; }
  .title { font-weight: 550; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .title .pre { color: var(--dim); font-weight: 400; }
  .meta { color: var(--dim); font-size: 12.5px; margin-top: 2px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badges { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
  /* Delegated workers hang under the session that spawned them. */
  .row.child { padding-left: 34px; }
  .row.child .title { font-size: 14px; font-weight: 500; }
  .row.child::before {
    content: "└"; position: absolute; margin-left: -17px;
    color: var(--line); font-family: var(--mono);
  }
  .row { position: relative; }
  .fold {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; color: var(--accent);
    border: 1px solid #23314a; border-radius: 20px;
    padding: 1px 7px; margin-right: 5px;
  }
  .fold:active { background: #23314a; }
  .pill { font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 20px; padding: 2px 7px; }
  .pill.work { color: var(--work); border-color: #3a3320; }
  .pill.queue { color: var(--accent); border-color: #23314a; }
  .section { padding: 12px 14px 4px; color: var(--dim); font-size: 12px;
    text-transform: uppercase; letter-spacing: .06em; }
  .empty { padding: 40px 20px; text-align: center; color: var(--dim); }

  /* ── detail ── */
  /* Sized from the *visual* viewport, not the layout one.
    
     iOS keeps the layout viewport at full height when the keyboard opens, so an
     `inset: 0` overlay keeps the height it had before the keyboard: #log stays
     tall, its content no longer overflows it, and there is genuinely nothing to
     scroll. The drag then falls through to the document, which is what made the
     transcript feel unscrollable while the page shifted around the composer.
     --vv-height / --vv-top are kept current from visualViewport in the script. */
  #detail { position: fixed; left: 0; right: 0; top: var(--vv-top, 0);
    height: var(--vv-height, 100%); background: var(--bg); z-index: 20;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top); }
  /* The overlay covers the page header, so it needs its own. */
  #detailHead { flex: 0 0 auto; position: static; }
  #back { font-size: 26px; line-height: 1; padding: 2px 12px 6px 8px;
    color: var(--accent); min-height: 0; }
  /* min-height:0 so the scroller can shrink below its content height; without
     it a column flex child refuses to shrink and the overflow escapes to the
     page. overscroll-behavior keeps a flick at either end from scrolling the
     document behind the overlay. */
  #log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px 8px;
    overscroll-behavior: contain; }
  .msg { margin: 0 0 12px; }
  .msg .who { font-size: 11.5px; color: var(--dim); margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: .05em; }

  /* ── final answer ── */
  /* The TUI draws a `▼ FINAL ANSWER` divider before the concluding message so
     the end of a run is obvious at a glance. On a phone a full-width divider
     is easy to miss while scrolling, so the answer is a raised card with an
     accent edge: the boundary is where the box starts, not where a line is. */
  .msg.final {
    margin: 16px -4px 14px; padding: 11px 12px 12px;
    background: var(--panel);
    border: 1px solid #23314a;
    border-left: 3px solid var(--accent);
    border-radius: 12px;
  }
  .msg.final .who {
    color: var(--accent); font-weight: 650; letter-spacing: .07em;
    display: flex; align-items: center; gap: 6px;
  }
  .msg.final .who::before { content: "▼"; font-size: 10px; }
  .msg.final > :last-child { margin-bottom: 0; }
  /* The divider rule above the card is the TUI's `---`.
     Drawn on the card itself so a collapsed/streamed re-render cannot leave a
     stray <hr> behind. */
  .msg.final + .msg.final { margin-top: 16px; }
  .msg .text { white-space: pre-wrap; word-break: break-word; }
  .msg.user .text { background: var(--panel-2); border-radius: 12px;
    padding: 9px 11px; }
  /* Rendered markdown keeps author line breaks but not wrapper whitespace. */
  .md { white-space: normal; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 .6em; }
  .md h1, .md h2, .md h3, .md h4 { margin: .8em 0 .4em; line-height: 1.25;
    font-weight: 650; }
  .md h1 { font-size: 1.25em; }
  .md h2 { font-size: 1.15em; }
  .md h3 { font-size: 1.05em; }
  .md h4 { font-size: 1em; color: var(--dim); }
  .md ul, .md ol { margin: 0 0 .6em; padding-left: 1.35em; }
  .md li { margin: .15em 0; }
  .md li > p { margin: 0; }
  .md code { font-family: var(--mono); font-size: .88em;
    background: #20262e; border: 1px solid var(--line); border-radius: 5px;
    padding: .1em .34em; word-break: break-word; }
  .md pre { background: #151a20; border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; overflow-x: auto;
    margin: 0 0 .6em; -webkit-overflow-scrolling: touch; }
  .md pre code { background: none; border: 0; padding: 0; font-size: 12.5px;
    white-space: pre; }
  .md blockquote { margin: 0 0 .6em; padding: .1em 0 .1em .8em;
    border-left: 2px solid var(--line); color: var(--dim); }
  .md a { color: var(--accent); text-decoration: none; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: .9em 0; }
  .md table { border-collapse: collapse; margin: 0 0 .6em; font-size: .95em;
    display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: .3em .5em;
    text-align: left; }
  .md th { background: var(--panel-2); font-weight: 600; }
  .md strong { font-weight: 650; }
  .md del { color: var(--dim); }
  .msg.pending .text { opacity: .55; }
  .msg.pending .who::after { content: " · sending"; opacity: .7; }
  .msg.user .who { color: var(--you); }
  .tool { color: var(--dim); font-family: var(--mono); font-size: 12.5px;
    padding: 2px 0 2px 10px; border-left: 2px solid var(--line);
    margin: 4px 0; white-space: pre-wrap; word-break: break-all; }
  .tool.err { color: var(--err); }
  .live { border: 1px dashed #3a3320; border-radius: 10px;
    padding: 8px 10px; margin-bottom: 12px; }
  .live.working { color: var(--work); animation: pulse 1.6s infinite; }
  .live .activity { color: var(--work); font-size: 12.5px; margin-bottom: 4px; }
  .stopped { color: var(--err); font-size: 12.5px; }
  .queue { margin: 0 12px 6px; border: 1px solid #23314a; border-radius: 10px;
    padding: 8px 10px; font-size: 13px; }
  .queue .item { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
  .queue .item span { flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .queue .item button { min-height: 28px; padding: 2px 8px; font-size: 12.5px; }
  footer {
    border-top: 1px solid var(--line); background: var(--panel);
    padding: 8px 10px; display: flex; gap: 8px; align-items: flex-end;
  }
  #input {
    flex: 1; font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 12px; padding: 9px 11px;
    resize: none; min-height: 40px; max-height: 40vh;
  }
  #input:focus { outline: 1px solid var(--accent); }

  /* ── composer completions ($skill, /command, @[session]) ── */
  /* One popup per text box that offers completions: the composer and the new
     agent prompt. In the composer it is a flex child above the footer, so it
     pushes the transcript up instead of covering the newest message. */
  .comp {
    flex: 0 0 auto; margin: 0 10px 6px; border: 1px solid var(--line);
    border-radius: 12px; background: var(--panel-2); overflow: hidden;
    display: flex; flex-direction: column; max-height: 46vh;
  }
  .comp .head { display: flex; align-items: center; gap: 8px;
    padding: 7px 10px 5px; color: var(--dim); font-size: 11.5px;
    text-transform: uppercase; letter-spacing: .05em;
    border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  .comp .head .scope { flex: 1; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; text-transform: none; letter-spacing: 0;
    font-size: 11.5px; }
  .comp .head select { font: inherit; color: var(--text);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 7px; padding: 2px 5px; font-size: 11.5px;
    text-transform: none; letter-spacing: 0; max-width: 46vw; }
  .comp .items { overflow-y: auto; -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain; }
  .comp .item { display: flex; gap: 9px; align-items: baseline;
    padding: 9px 11px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .comp .item:last-child { border-bottom: 0; }
  .comp .item .name { font-family: var(--mono); font-size: 13px;
    color: var(--text); flex: 0 1 auto; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  .comp .item .desc { color: var(--dim); font-size: 12px; flex: 1 1 auto;
    min-width: 0; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; text-align: right; }
  .comp .item.sel { background: #23314a; }
  .comp .item.none { color: var(--dim); font-size: 13px; }
  /* Inside a sheet the popup follows its field instead of the footer. */
  .pad .comp { margin: 0 0 10px; max-height: 34vh; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(80px + env(safe-area-inset-bottom)); z-index: 40;
    background: #20262e; border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; font-size: 13.5px; max-width: 88vw; }

  /* ── action sheet ── */
  #scrim { position: fixed; inset: 0; background: #0008; z-index: 50;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding-bottom: env(safe-area-inset-bottom); }
  .sheet { background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0; max-height: 86vh; display: flex;
    flex-direction: column; }
  .sheet h3 { margin: 0; padding: 14px 16px 8px; font-size: 13px;
    font-weight: 600; color: var(--dim); text-transform: uppercase;
    letter-spacing: .06em; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .sheet .items { overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 0 0 8px; }
  .sheet .act { display: flex; align-items: center; gap: 12px;
    padding: 13px 16px; border-bottom: 1px solid var(--line);
    font-size: 15.5px; }
  .sheet .act:active { background: var(--panel-2); }
  .sheet .act .ico { width: 22px; text-align: center; color: var(--dim);
    flex: 0 0 auto; }
  .sheet .act .lbl { flex: 1; }
  .sheet .act .sub { color: var(--dim); font-size: 12.5px; margin-top: 1px; }
  .sheet .act.danger, .sheet .act.danger .ico { color: var(--err); }
  .sheet .act.on .lbl::after { content: " ✓"; color: var(--accent); }
  .sheet .act.disabled { opacity: .4; pointer-events: none; }
  .sheet .pad { padding: 12px 16px 16px; }
  .sheet .pad input, .sheet .pad select, .sheet .pad textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px;
    margin-bottom: 10px; resize: none; }
  .sheet .pad label { display: block; color: var(--dim); font-size: 12px;
    text-transform: uppercase; letter-spacing: .05em; margin: 0 0 5px; }
  .sheet .row2 { display: flex; gap: 8px; }
  .sheet .row2 > * { flex: 1; }
  .rowMore { flex: 0 0 auto; align-self: center; color: var(--dim);
    background: transparent; border: 0; min-height: 32px; padding: 0 4px;
    font-size: 19px; line-height: 1; }
  /* tabs above the list */
  .tabs { display: flex; gap: 6px; padding: 8px 12px 2px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; }
  .tabs button { font-size: 13px; padding: 5px 11px; min-height: 30px;
    border-radius: 20px; background: transparent; color: var(--dim);
    border: 1px solid var(--line); white-space: nowrap; }
  .tabs button.on { color: var(--accent); border-color: #23314a;
    background: #23314a40; }
</style>
</head>
<body>

<header id="listHead">
  <h1 id="h1">orch</h1>
  <button class="ghost" id="newBtn" title="New agent">＋</button>
  <button class="ghost" id="menuBtn" title="More">☰</button>
  <button class="ghost" id="refresh" title="Refresh">⟳</button>
</header>

<div class="tabs" id="tabs"></div>
<main id="list"></main>

<section id="detail" class="hidden">
  <header id="detailHead">
    <button class="ghost" id="back" aria-label="Back to the list">‹</button>
    <h1 id="h2">…</h1>
    <button class="ghost" id="moreBtn" title="Session actions">⋯</button>
  </header>
  <div id="log"></div>
  <div id="queueBox" class="queue hidden"></div>
  <div id="comp" class="comp hidden"></div>
  <footer>
    <textarea id="input" rows="1" placeholder="Message…"
      enterkeyhint="enter"></textarea>
    <button class="primary" id="send">Send</button>
  </footer>
</section>

<script>
(() => {
  "use strict";

  const store = {
    token: localStorage.getItem("orch.token") || "",
    rows: [],
    groups: [],
    models: null,
    /** "inbox" | "archived" | "all" | "hidden" — the same four tabs the TUI has. */
    view: localStorage.getItem("orch.view") || "inbox",
    /**
     * Whether tool calls are drawn at all: "hidden" removes every tool line,
     * "shown" (the default) keeps them. Display-only and per-device, like the
     * view tab -- the daemon keeps sending them either way, because hiding is a
     * rendering choice, not a filtering one.
     */
    tools: localStorage.getItem("orch.tools") === "hidden" ? "hidden" : "shown",
    /**
     * "groups" | "flat" — the All-groups list layout, shared with the TUI via
     * the group store. Seeded from the last fetch; null until then so the list
     * never draws the wrong shape for a frame.
     */
    layout: null,
    id: null,
    row: null,
    es: null,
    poll: null,
    /** The last detail payload, so a display-only change can repaint in place. */
    last: null,
    /** Whether the transcript is pinned to the newest message (null = not yet known). */
    stickToBottom: null,
    /** Whether the daemon offers a terminal (ORCH_WEB_ALLOW_TERM=1 + node-pty). */
    term: null,
    /** `$skill` / `/command` / `@[session]` catalog, built by the daemon. */
    catalog: null,
    /** Group list + sessions from the last `@` popup. */
    mentions: null,
  };

  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  };

  // ── token ─────────────────────────────────────────────────────────
  const url = new URL(location.href);
  const t = url.searchParams.get("token");
  if (t) {
    store.token = t;
    localStorage.setItem("orch.token", t);
    url.searchParams.delete("token");
    history.replaceState(null, "", url.pathname + url.search);
  }
  // No token yet: ask for the code the daemon printed in the terminal, and
  // trade it for the token. This is the normal path on a new phone.
  if (!store.token) {
    showPairing();
    return;
  }

  function showPairing() {
    const wrap = el("div");
    wrap.style.cssText = "padding:28px 20px;max-width:420px;margin:0 auto";
    wrap.append(el("h1", null, "Pair this phone"));
    wrap.firstChild.style.cssText = "font-size:20px;margin:0 0 6px";
    const hint = el("p", null,
      "Run this on the Mac, then type the 6-digit code it prints:");
    hint.style.cssText = "color:var(--dim);font-size:14px;margin:0 0 14px";
    wrap.append(hint);
    const cmd = el("div", null, "orch-web --pair");
    cmd.style.cssText =
      "font-family:var(--mono);font-size:13px;background:var(--panel-2);" +
      "border:1px solid var(--line);border-radius:9px;padding:9px 11px;" +
      "margin-bottom:18px";
    wrap.append(cmd);

    const form = el("form");
    form.style.cssText = "display:flex;gap:8px";
    const inp = el("input");
    inp.type = "tel";
    inp.inputMode = "numeric";
    inp.autocomplete = "one-time-code";
    inp.maxLength = 6;
    inp.placeholder = "123456";
    inp.setAttribute("aria-label", "pairing code");
    inp.style.cssText =
      "flex:1;font:inherit;font-size:22px;letter-spacing:.22em;" +
      "text-align:center;font-family:var(--mono);color:var(--text);" +
      "background:var(--panel-2);border:1px solid var(--line);" +
      "border-radius:12px;padding:10px";
    const go = el("button", "primary", "Pair");
    form.append(inp, go);
    wrap.append(form);

    const msg = el("p");
    msg.style.cssText = "color:var(--err);font-size:13.5px;min-height:20px;" +
      "margin:10px 0 0";
    wrap.append(msg);

    form.onsubmit = async (e) => {
      e.preventDefault();
      const code = inp.value.replace(/\D/g, "");
      if (code.length !== 6) { msg.textContent = "Six digits."; return; }
      go.disabled = true;
      msg.textContent = "";
      try {
        const res = await fetch("/api/pair", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ code }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "pairing failed");
        localStorage.setItem("orch.token", data.token);
        location.replace("/");
      } catch (err) {
        msg.textContent = String(err.message || err);
        go.disabled = false;
        inp.select();
      }
    };

    document.body.textContent = "";
    document.body.append(wrap);
    inp.focus();
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: body ? "POST" : "GET",
      headers: {
        authorization: `Bearer ${store.token}`,
        "content-type": "application/json",
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function toast(msg, ms = 2600) {
    document.querySelectorAll(".toast").forEach((n) => n.remove());
    const n = el("div", "toast", msg);
    document.body.appendChild(n);
    setTimeout(() => n.remove(), ms);
  }

  const ago = (ms) => {
    const s = Math.max(0, (Date.now() - ms) / 1000);
    if (s < 60) return `${Math.floor(s)}s`;
    if (s < 3600) return `${Math.floor(s / 60)}m`;
    if (s < 86400) return `${Math.floor(s / 3600)}h`;
    return `${Math.floor(s / 86400)}d`;
  };

  const label = (row) => {
    if (row.state === "working") return "working";
    if (row.state === "queued") return "queued";
    if (row.status === "your-turn") return "your turn";
    if (row.status === "error") return "error";
    if (row.status === "stalled") return "stalled";
    if (row.status === "aborted") return "aborted";
    return "";
  };
  const dotClass = (row) =>
    [row.state || row.status || "", row.unread ? "unread" : ""]
      .filter(Boolean)
      .join(" ");

  // ── list ──────────────────────────────────────────────────────────
  function renderList() {
    const list = $("#list");
    list.textContent = "";
    if (!store.rows.length) {
      list.append(el("div", "empty", emptyText()));
      return;
    }
    // Flat is the same rows in one run, each naming its own group. Grouped is
    // the TUI's sections. Both honour pinned-first, which is the one ordering
    // rule the two views share.
    if (store.layout === "flat") {
      const rows = store.rows.slice().sort((a, b) =>
        (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      for (const row of rows) list.append(renderRow(row));
      return;
    }
    const byGroup = new Map();
    for (const row of store.rows) {
      const key = row.groupId || "__none";
      if (!byGroup.has(key)) byGroup.set(key, []);
      byGroup.get(key).push(row);
    }
    const groupName = (id) => {
      if (id === "__none") return "Sessions";
      const g = store.groups.find((x) => x.id === id);
      return g ? g.name : "Sessions";
    };
    // Pinned first inside each section, like the TUI's ★ PINNED partition.
    for (const rows of byGroup.values()) {
      rows.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
    }
    const order = [...byGroup.keys()].sort((a, b) =>
      a === "__none" ? -1 : b === "__none" ? 1 :
      groupName(a).localeCompare(groupName(b)));
    for (const key of order) {
      const section = el("div", "section", groupName(key));
      list.append(section);
      for (const row of byGroup.get(key)) list.append(renderRow(row));
    }
  }

  function emptyText() {
    if (store.view === "archived") return "Nothing archived.";
    if (store.view === "hidden") return "Nothing hidden.";
    return "No sessions yet.";
  }

  const VIEWS = [
    { id: "inbox", label: "Inbox" },
    { id: "archived", label: "Archived" },
    { id: "all", label: "All" },
    { id: "hidden", label: "Hidden" },
  ];

  function renderTabs() {
    const bar = $("#tabs");
    bar.textContent = "";
    for (const v of VIEWS) {
      const b = el("button", store.view === v.id ? "on" : "", v.label);
      b.onclick = () => setView(v.id);
      bar.append(b);
    }
  }

  function setView(id) {
    if (store.view === id) return;
    store.view = id;
    localStorage.setItem("orch.view", id);
    renderTabs();
    // The three non-inbox tabs read the whole store, so clear before the fetch
    // or the old rows show under the new tab's heading.
    store.rows = [];
    renderList();
    refresh();
  }

  /**
   * Show or hide tool calls everywhere in the transcript.
   *
   * Repaints from the payload already on screen rather than waiting for the
   * stream: a settled session sends no further ticks, and this preference is not
   * part of the fingerprint that decides when a tick is worth sending.
   */
  function setTools(mode) {
    store.tools = mode;
    localStorage.setItem("orch.tools", mode);
    toast(mode === "hidden" ? "Tool calls hidden" : "Tool calls shown");
    // Nothing else would repaint a settled session: the stream only resends when
    // its fingerprint moves, and this preference is not part of that fingerprint.
    if (store.last) renderDetail(store.last);
  }

  function renderRow(row) {
    const n = el("div", row.child ? "row child" : "row");
    n.append(el("div", `dot ${dotClass(row)}`));
    const body = el("div", "body");
    const title = el("div", "title");
    if (row.pinned) title.append(el("span", "pre", "★ "));
    if (row.hidden) title.append(el("span", "pre", "⊘ "));
    // A parent with delegated workers gets a fold chip: tap the chip to open the
    // family, tap the row to open the session. Tapping the row too would make
    // expanding a fan-out cost you a session switch.
    if (!row.child && row.children > 0) {
      const chip = el("span", "fold", `${row.expanded ? "▾" : "▸"} ${row.children}`);
      chip.onclick = (ev) => {
        ev.stopPropagation();
        toggleFold(row);
      };
      title.append(chip);
    }
    title.append(document.createTextNode(row.title));
    body.append(title);
    const bits = [label(row), ago(row.updated)].filter(Boolean);
    // In the flat list the section header is gone, so the group has to travel
    // with the row or the grouping is simply lost.
    if (store.layout === "flat") {
      const group = groupNameOf(row);
      if (group) bits.push(group);
    }
    if (row.archived) bits.push("archived");
    if (row.model) bits.push(shortModel(row.model));
    body.append(el("div", "meta", bits.join(" · ")));
    const last = row.lastSaid?.text || row.lastText;
    if (last) {
      body.append(el("div", "meta",
        (row.lastSaid?.role === "user" ? "you: " : "") +
        last.replace(/\s+/g, " ").slice(0, 110)));
    }
    n.append(body);
    const badges = el("div", "badges");
    if (row.pending) badges.append(el("span", "pill queue", `${row.pending}⏳`));
    if (row.state === "working") badges.append(el("span", "pill work", "●"));
    n.append(badges);
    // A row-level menu: the actions a long-press would offer, without making
    // the row body any less of a "open the session" target.
    const more = el("button", "rowMore", "⋯");
    more.onclick = (ev) => { ev.stopPropagation(); rowMenu(row); };
    n.append(more);
    n.onclick = () => open(row.id);
    return n;
  }

  // Provider prefix is dropped for display only; the full reference is what the
  // server stores. Strip any prefix rather than a known one, so this file stays
  // free of any particular provider's name.
  const shortModel = (m) => m.replace(/^[^/]+\//, "");

  /**
   * Open or close a parent's delegated workers. Flip locally first so the tap
   * feels instant, then persist; a failure reloads the list from the server so
   * the UI never lies about what is collapsed.
   */
  async function toggleFold(row) {
    const want = !row.expanded;
    row.expanded = want;
    renderList();
    try {
      await api("/api/fold", { id: row.id, expanded: want });
      await refresh();
    } catch (e) {
      toast(e.message);
      await refresh();
    }
  }

  /**
   * Is the phone allowed to open a shell? Only the daemon knows (the flag is
   * read from its environment), and it is cheap enough to ask on every refresh.
   */
  async function termAvailable() {
    try {
      const s = await api("/api/term/status");
      store.term = s.allowed === true && s.ready === true;
    } catch {
      store.term = false;
    }
  }

  async function refresh() {
    try {
      const q =
        store.view === "archived" ? "?archived=1"
        : store.view === "all" ? "?archived=1&hidden=1"
        : store.view === "hidden" ? "?archived=1&hidden=1"
        : "";
      const data = await api(`/api/rows${q}`);
      store.rows = data.rows.filter(
        store.view === "hidden" ? (r) => r.hidden
        : store.view === "archived" ? (r) => r.archived
        : store.view === "all" ? () => true
        : (r) => !r.archived,
      );
      store.groups = data.groups;
      if (data.layout === "flat" || data.layout === "groups") {
        store.layout = data.layout;
      }
      // Asked once per refresh; a daemon without terminals just says so.
      void termAvailable();
      // Keep the open session's row current so a mention's group resolves and
      // the header's state is right even while the transcript stream ticks.
      if (store.id) store.row = store.rows.find((r) => r.id === store.id) || store.row;
      if (!store.id) renderList();
      else completion.refresh();
      $("#h1").textContent = "orch";
    } catch (e) {
      if (!store.rows.length) $("#list").textContent = "";
      $("#list").append(el("div", "empty", String(e.message || e)));
    }
  }

  // ── detail ────────────────────────────────────────────────────────

  /**
   * Keep the overlay the size of the *visible* area.
   *
   * On iOS the layout viewport keeps its full height when the keyboard opens,
   * and a `position: fixed; inset: 0` box keeps that height: the transcript
   * stays as tall as before the keyboard, so its content no longer overflows
   * and it cannot scroll, while the visible sliver scrolls the document
   * instead. visualViewport reports what is actually on screen, so mirror it
   * onto the overlay. `offsetTop` covers the page-shifted-up case (older iOS
   * pushes the whole viewport rather than resizing it).
   */
  function syncViewport() {
    const vv = window.visualViewport;
    const root = document.documentElement;
    if (!vv) {
      root.style.removeProperty("--vv-height");
      root.style.removeProperty("--vv-top");
      return;
    }
    root.style.setProperty("--vv-height", `${Math.round(vv.height)}px`);
    root.style.setProperty("--vv-top", `${Math.round(vv.offsetTop)}px`);
    // The transcript just got taller or shorter under the same scrollTop. Stay
    // pinned to the newest message if that is where the reader already was;
    // leave a scrolled-back reader alone.
    const log = document.getElementById("log");
    if (log && !document.getElementById("detail").classList.contains("hidden")) {
      if (store.stickToBottom !== false) log.scrollTop = log.scrollHeight;
    }
  }

  if (window.visualViewport) {
    // resize covers the keyboard opening and closing; scroll covers iOS
    // shifting the page instead of resizing it. Both are cheap and idempotent.
    window.visualViewport.addEventListener("resize", syncViewport);
    window.visualViewport.addEventListener("scroll", syncViewport);
    window.addEventListener("orientationchange", syncViewport);
  }

  async function open(id) {
    store.id = id;
    // A previous session's payload must never be repainted onto this one.
    store.last = null;
    document.body.classList.add("detail-open");
    syncViewport();
    $("#detail").classList.remove("hidden");
    $("#list").classList.add("hidden");
    $("#log").textContent = "";
    $("#h2").textContent = "…";
    api("/api/seen", { id }).catch(() => {});
    watch(id);
    // Give the phone's back gesture something to pop, so it returns to the
    // list instead of leaving the app.
    if (history.state?.orch !== id) history.pushState({ orch: id }, "", "#" + id);
    // Deliberately do NOT focus the composer on entry: on a phone that pops the
    // keyboard and covers half the transcript before you have read anything.
    // The composer takes focus when tapped, which is when you want to type.
    const focused = document.activeElement;
    if (focused && focused.id === "input") focused.blur();
  }

  /** Hide the overlay and refresh the list. Idempotent; safe to call twice. */
  function leave() {
    if (!store.id) return;
    dismissSheet();
    completion.close();
    inFlight.length = 0;
    stopWatch();
    store.id = null;
    store.row = null;
    store.last = null;
    document.body.classList.remove("detail-open");
    $("#detail").classList.add("hidden");
    $("#list").classList.remove("hidden");
    document.title = "orch";
    refresh();
  }

  function close() {
    // Unwind our own history entry first and let popstate do the teardown, so
    // the button and the phone's back gesture take exactly one path.
    if (history.state?.orch) history.back();
    else leave();
  }

  // Back gesture, or close()'s history.back(). A sheet is the innermost surface:
  // if one is open, the gesture should close it rather than the whole session.
  window.addEventListener("popstate", () => {
    if (closeSheet) {
      dismissSheet();
      // Re-arm our history entry so leaving again still reaches the list.
      if (store.id && history.state?.orch !== store.id) {
        history.pushState({ orch: store.id }, "", "#" + store.id);
      }
      return;
    }
    leave();
  });

  function stopWatch() {
    if (store.es) { store.es.close(); store.es = null; }
  }

  function watch(id) {
    stopWatch();
    const es = new EventSource(
      `/api/stream/${encodeURIComponent(id)}?token=` +
      encodeURIComponent(store.token));
    store.es = es;
    es.onmessage = (ev) => {
      let data;
      try { data = JSON.parse(ev.data); } catch { return; }
      renderDetail(data);
    };
    es.onerror = () => {
      // EventSource retries by itself; show it only if it keeps failing.
    };
  }

  // ── markdown ──────────────────────────────────────────────────────
  // Small renderer, written rather than pulled in: the client is one file with
  // no build step, and a full markdown library is more bytes than everything
  // else here combined.
  //
  // Safety: the text is escaped *first*, so no raw HTML from a transcript can
  // reach the DOM. Only the limited inline set below produces tags, and link
  // hrefs are checked against a scheme allowlist. That ordering is the whole
  // defence — don't reorder it, and don't add a path that injects unescaped.
  const MD = (() => {
    const esc = (t) => t
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
    const safeHref = (u) => {
      const v = u.trim();
      if (/^(https?:|mailto:)/i.test(v)) return v;
      if (/^[./#]/.test(v)) return v;          // relative: harmless
      return null;                              // javascript:, data:, etc.
    };

    // Inline: code spans first so their contents are never re-parsed.
    function inline(text) {
      const codes = [];
      let out = esc(text).replace(/`([^`\n]+)`/g, (_, c) => {
        codes.push(c);
        return "\u0000" + (codes.length - 1) + "\u0000";
      });
      out = out
        .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (m, alt, url) => {
          const href = safeHref(url.replace(/&amp;/g, "&"));
          return href ? `<a href="${esc(href)}">${alt || href}</a>` : m;
        })
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, label, url) => {
          const href = safeHref(url.replace(/&amp;/g, "&"));
          return href
            ? `<a href="${esc(href)}" target="_blank" rel="noreferrer noopener">${label}</a>`
            : m;
        })
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
        .replace(/(^|[\s(])_([^_\n]+)_/g, "$1<em>$2</em>")
        .replace(/~~([^~]+)~~/g, "<del>$1</del>");
      return out.replace(/\u0000(\d+)\u0000/g, (_, i) =>
        `<code>${codes[+i]}</code>`);
    }

    // Block: line-oriented, which is what transcripts actually contain.
    function render(src) {
      const lines = String(src ?? "").replace(/\r\n?/g, "\n").split("\n");
      const html = [];
      let i = 0;
      let list = null;   // { tag, items[] }
      let para = [];

      const flushPara = () => {
        if (para.length) {
          html.push(`<p>${inline(para.join(" "))}</p>`);
          para = [];
        }
      };
      const flushList = () => {
        if (!list) return;
        html.push(`<${list.tag}>${list.items
          .map((t) => `<li>${inline(t)}</li>`).join("")}</${list.tag}>`);
        list = null;
      };
      const flushAll = () => { flushPara(); flushList(); };

      while (i < lines.length) {
        const line = lines[i];

        // fenced code
        const fence = line.match(/^\s*(```|~~~)\s*([\w+-]*)\s*$/);
        if (fence) {
          flushAll();
          const marker = fence[1];
          const body = [];
          i++;
          while (i < lines.length && !new RegExp(`^\\s*${marker}\\s*$`).test(lines[i])) {
            body.push(lines[i]);
            i++;
          }
          i++; // closing fence (or EOF)
          html.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
          continue;
        }

        if (!line.trim()) { flushAll(); i++; continue; }

        // heading
        const h = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
        if (h) {
          flushAll();
          const lvl = Math.min(h[1].length, 4);
          html.push(`<h${lvl}>${inline(h[2].replace(/\s+#+\s*$/, ""))}</h${lvl}>`);
          i++;
          continue;
        }

        if (/^\s{0,3}([-*_])\s*\1\s*\1[\s\1]*$/.test(line)) {
          flushAll(); html.push("<hr>"); i++; continue;
        }

        // table: header row + separator
        if (line.includes("|") &&
            i + 1 < lines.length &&
            /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1]) &&
            lines[i + 1].includes("-")) {
          flushAll();
          const cells = (r) => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "")
            .split("|").map((c) => c.trim());
          const head = cells(line);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim()) {
            rows.push(cells(lines[i]));
            i++;
          }
          html.push("<table><thead><tr>" +
            head.map((c) => `<th>${inline(c)}</th>`).join("") +
            "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + head.map((_, k) =>
              `<td>${inline(r[k] ?? "")}</td>`).join("") + "</tr>").join("") +
            "</tbody></table>");
          continue;
        }

        // blockquote
        if (/^\s{0,3}>/.test(line)) {
          flushAll();
          const body = [];
          while (i < lines.length && /^\s{0,3}>/.test(lines[i])) {
            body.push(lines[i].replace(/^\s{0,3}>\s?/, ""));
            i++;
          }
          html.push(`<blockquote>${render(body.join("\n"))}</blockquote>`);
          continue;
        }

        // list item (one level; nested lists are rare in a transcript tail)
        const li = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (li) {
          flushPara();
          const tag = /\d/.test(li[2]) ? "ol" : "ul";
          if (list && list.tag !== tag) flushList();
          if (!list) list = { tag, items: [] };
          list.items.push(li[3]);
          i++;
          // soft-wrapped continuation lines belong to the same item
          while (i < lines.length && /^\s{2,}\S/.test(lines[i]) &&
                 !/^(\s*)([-*+]|\d+[.)])\s+/.test(lines[i])) {
            list.items[list.items.length - 1] += " " + lines[i].trim();
            i++;
          }
          continue;
        }

        para.push(line.trim());
        i++;
      }
      flushAll();
      return html.join("");
    }

    return { render, esc };
  })();

  /** A div holding rendered markdown; falls back to plain text if anything throws. */
  function mdNode(text, cls) {
    const n = el("div", cls || "text md");
    try {
      n.innerHTML = MD.render(text);
    } catch {
      n.className = cls || "text";
      n.textContent = text;
    }
    return n;
  }

  function renderDetail(data) {
    const { row, messages, pending, model, live, activity } = data;
    if (!row) return;
    store.row = row;
    // Kept so a display-only change (hiding tool calls) can repaint from the
    // payload already on screen instead of waiting for the stream to resend a
    // fingerprint that has not moved.
    store.last = data;
    $("#h2").textContent = row.title;
    document.title = row.title;

    const log = $("#log");
    const atBottom =
      log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    store.stickToBottom = atBottom;
    log.textContent = "";

    // Total hidden / total shown, no per-call collapse: a tool step is already
    // one line here, so a half-open state would cost more taps than it saves.
    const showTools = store.tools !== "hidden";

    // With the tool lines gone, a step that only called a tool has nothing left
    // to say -- but each step is its own assistant message, so drawing one box
    // per message turns a busy run into a column of bare "agent" labels. In
    // hidden mode the steps of a turn share one box and one label; a step with
    // no text drops out entirely.
    let step = null;
    const flushStep = () => {
      if (!step) return;
      const s = step;
      step = null;
      // An error or abort is the turn's outcome, so it survives even when the
      // step said nothing.
      if (!s.parts.length && !s.stopped) return;
      const box = el("div", "msg");
      box.append(el("div", "who", "agent"));
      for (const part of s.parts) box.append(mdNode(part));
      if (s.stopped === "error")
        box.append(el("div", "stopped", `✗ ${s.error || "error"}`));
      if (s.stopped === "aborted")
        box.append(el("div", "stopped", "⏸ aborted"));
      log.append(box);
    };

    reconcileInFlight(messages);
    for (const m of messages) {
      if (m.role === "user") {
        flushStep();
        const box = el("div", "msg user");
        box.append(el("div", "who", "you"));
        box.append(mdNode(m.text));
        log.append(box);
      } else if (m.role === "assistant") {
        // The run's conclusion is marked by the server from the message's own
        // stop reason, so a reload or another front end agrees with the TUI.
        if (m.final) {
          // The conclusion stands alone: it is text by definition, and it is
          // what the turn is for, so it does not join the running step box.
          flushStep();
          const box = el("div", "msg final");
          box.append(el("div", "who", "final answer"));
          if (m.text) box.append(mdNode(m.text));
          log.append(box);
          continue;
        }
        if (!showTools) {
          if (!step) step = { parts: [], stopped: null, error: undefined };
          if (m.text) step.parts.push(m.text);
          if (m.stopped) {
            step.stopped = m.stopped;
            step.error = m.error;
          }
          continue;
        }
        const box = el("div", "msg");
        box.append(el("div", "who", "agent"));
        if (m.text) box.append(mdNode(m.text));
        for (const tool of m.tools || []) {
          box.append(el("div", "tool",
            `🔧 ${tool.name}${tool.arg ? " " + tool.arg : ""}`));
        }
        if (m.stopped === "error")
          box.append(el("div", "stopped", `✗ ${m.error || "error"}`));
        if (m.stopped === "aborted")
          box.append(el("div", "stopped", "⏸ aborted"));
        log.append(box);
      } else if (m.role === "toolError" && showTools) {
        log.append(el("div", "tool err", `↳ ✗ ${m.text}`));
      }
    }
    flushStep();

    const working = row.state === "working" || row.state === "queued";
    if (!live?.length && !activity && working) {
      // The run is in flight but its output is not readable yet (a foreign run
      // whose event file has not flushed, or a very early turn).
      log.append(el("div", "live working", "● working — waiting for output…"));
    } else if (live?.length || activity) {
      const box = el("div", "live");
      if (activity && showTools) box.append(el("div", "activity", `● ${activity}`));
      for (const item of live) {
        const kind = item.kind || "text";
        const text = item.text || "";
        // Hiding tools must not leave an empty dashed box behind: if every
        // in-flight item was a tool step, the box has nothing to say.
        if (kind === "tool" || kind === "error") {
          if (showTools)
            box.append(el("div", kind === "tool" ? "tool" : "tool err",
              `${kind === "tool" ? "🔧" : "✗"} ${text}`));
        } else if (kind === "text") {
          box.append(mdNode(text));
        }
      }
      if (box.childNodes.length) log.append(box);
      else if (working)
        log.append(el("div", "live working", "● working — waiting for output…"));
    }

    const q = $("#queueBox");
    q.textContent = "";
    if (pending?.length) {
      q.classList.remove("hidden");
      // Say WHY it is waiting. "waiting for a free agent slot" was the only
      // wording before, shown for every reason -- including a run held by
      // another process, which no amount of capacity would fix.
      q.append(el("div", "who", `queued (${pending.length})${queueSuffix(row)}`));
      pending.forEach((text, i) => {
        const item = el("div", "item");
        item.append(el("span", null, text.replace(/\s+/g, " ")));
        const sendNow = el("button", null, "now");
        sendNow.onclick = () =>
          api("/api/queue/now", { id: store.id, index: i }).catch((e) =>
            toast(e.message));
        const drop = el("button", "danger", "✕");
        drop.onclick = () =>
          api("/api/queue/remove", { id: store.id, index: i }).catch((e) =>
            toast(e.message));
        item.append(sendNow, drop);
        q.append(item);
      });
    } else {
      q.classList.add("hidden");
    }

    renderPending(log);

    const send = $("#send");
    const busy = row.state === "working" || row.state === "queued";
    send.textContent = busy ? "Queue" : "Send";
    send.title = busy ? busyHint(row) : "";
    if (atBottom) log.scrollTop = log.scrollHeight;
  }

  /**
   * The reason a queued message has not started, in the user's terms.
   *
   * Only `slot` is a capacity problem. `writer` means another live pi holds the
   * session and will run it when it is done; `running` is this agent's own run
   * still in flight. Conflating them made an idle session look capacity-blocked.
   */
  function queueSuffix(row) {
    if (row.queueReason === "slot") return " — waiting for a free slot";
    if (row.queueReason === "writer") return " — another pi is running it";
    if (row.queueReason === "running") return " — after this run";
    return "";
  }

  function busyHint(row) {
    if (row.queueReason === "slot") return "All agent slots are busy; this will start when one frees";
    if (row.queueReason === "writer") return "Another pi process is running this session; your message runs after it";
    return "Working — your message will run after this turn";
  }

  // Messages sent but not yet echoed back in the transcript. The server reads
  // the JSONL, so an accepted message only appears a poll later; without this
  // the composer looks like it swallowed the text.
  const inFlight = [];

  /** Drop echoes that have arrived, so the pending copy does not double up. */
  function reconcileInFlight(messages) {
    if (!inFlight.length) return;
    for (let i = inFlight.length - 1; i >= 0; i--) {
      const p = inFlight[i];
      const seen = messages.some(
        (m) => m.role === "user" && m.text.trim() === p.text.trim(),
      );
      if (seen) inFlight.splice(i, 1);
    }
  }

  function renderPending(log) {
    for (const p of inFlight) {
      const box = el("div", "msg user pending");
      box.append(el("div", "who", "you"));
      box.append(mdNode(p.text));
      log.append(box);
    }
  }

  async function submit() {
    const box = $("#input");
    const text = box.value.trim();
    if (!text || !store.id) return;
    completion.close();
    box.value = "";
    box.style.height = "auto";
    // Show it now; reconcileInFlight removes it once the transcript has it.
    const mine = { text, at: Date.now() };
    inFlight.push(mine);
    paintPending();
    try {
      const res = await api("/api/send", { id: store.id, text });
      if (res.ok === false) {
        // The message was accepted but no run appeared: say so instead of
        // implying it is on its way.
        dropPending(mine);
        toast(`Not started: ${res.detail || res.disposition}`, 6000);
        box.value = text;
        return;
      }
      const label =
        res.disposition === "queued" ? "Queued"
        : res.disposition === "started" ? "Sent"
        : `Sent (${res.state || res.disposition})`;
      toast(label);
    } catch (e) {
      dropPending(mine);
      toast(e.message, 6000);
      box.value = text;
    }
  }

  function dropPending(mine) {
    const i = inFlight.indexOf(mine);
    if (i >= 0) inFlight.splice(i, 1);
    paintPending();
  }

  /** Append/remove pending bubbles without rebuilding the whole transcript. */
  function paintPending() {
    const log = $("#log");
    if (!log || $("#detail").classList.contains("hidden")) return;
    for (const n of log.querySelectorAll(".msg.pending")) n.remove();
    if (!inFlight.length) return;
    renderPending(log);
    log.scrollTop = log.scrollHeight;
  }

  // ── action sheet ─────────────────────────────────────────────────
  // One bottom sheet, reused for every menu: the session list, the row menu,
  // and the detail header. Building it from a descriptor list keeps the phone
  // UI honest about what the daemon actually supports.
  let closeSheet = null;

  function sheet(title, build) {
    dismissSheet();
    const scrim = el("div");
    scrim.id = "scrim";
    const box = el("div", "sheet");
    if (title) box.append(el("h3", null, title));
    const items = el("div", "items");
    box.append(items);
    scrim.append(box);
    scrim.onclick = (e) => { if (e.target === scrim) dismissSheet(); };
    document.body.append(scrim);
    closeSheet = () => {
      scrim.remove();
      closeSheet = null;
    };
    build(items, dismissSheet);
    return closeSheet;
  }

  function dismissSheet() {
    if (closeSheet) closeSheet();
  }

  /**
   * One action row. `run` closes the sheet first, so a following sheet (a
   * picker, a prompt) opens on its own instead of stacking.
   */
  function act(parent, opts) {
    const n = el("div", "act" + (opts.danger ? " danger" : "") +
      (opts.on ? " on" : "") + (opts.disabled ? " disabled" : ""));
    n.append(el("span", "ico", opts.icon || "·"));
    const labelBox = el("div", "lbl");
    labelBox.append(document.createTextNode(opts.label));
    if (opts.sub) labelBox.append(el("div", "sub", opts.sub));
    n.append(labelBox);
    n.onclick = () => {
      dismissSheet();
      // Let the sheet close before a prompt/dialog steals focus on iOS.
      setTimeout(() => { try { opts.run?.(); } catch (e) { toast(String(e.message || e)); } }, 0);
    };
    parent.append(n);
    return n;
  }

  /** A sheet body with free-form fields; `fields` are appended before the buttons. */
  function pad(parent, title) {
    const p = el("div", "pad");
    if (title) parent.append(el("h3", null, title));
    parent.append(p);
    return p;
  }

  function field(parent, { label, value, multiline, placeholder, type }) {
    if (label) parent.append(el("label", null, label));
    const n = multiline ? el("textarea") : el("input");
    if (multiline) n.rows = multiline;
    if (type) n.type = type;
    if (placeholder) n.placeholder = placeholder;
    if (value != null) n.value = value;
    // iOS zooms the page on a <16px input; keep the font explicit.
    n.style.fontSize = "16px";
    parent.append(n);
    return n;
  }

  // ── session actions ──────────────────────────────────────────────

  /** The same action set as the TUI's inbox keys, in the order you reach for them. */
  function rowMenu(row) {
    sheet(row.title, (items, close) => {
      act(items, {
        icon: "↗", label: "Open",
        run: () => open(row.id),
      });
      act(items, {
        icon: "✎", label: "Rename",
        run: () => renameSheet(row),
      });
      act(items, {
        icon: "⇄", label: "Change model",
        sub: row.model ? shortModel(row.model) : undefined,
        run: () => modelSheet(row),
      });
      act(items, {
        icon: "⧉", label: "Clone",
        sub: row.state === "working" ? "cut before the active prompt" : undefined,
        run: () => cloneSession(row),
      });
      act(items, {
        icon: "◧", label: "Move to group",
        sub: groupLabelOf(row),
        run: () => groupSheet(row),
      });
      act(items, {
        icon: row.pinned ? "★" : "☆",
        label: row.pinned ? "Unpin" : "Pin to top",
        on: row.pinned,
        run: () => setMeta(row, { pinned: !row.pinned }, row.pinned ? "Unpinned" : "Pinned"),
      });
      act(items, {
        icon: row.unread ? "●" : "○",
        label: row.unread ? "Mark read" : "Mark unread",
        run: () => setMeta(row, { unread: !row.unread }, row.unread ? "Marked read" : "Marked unread"),
      });
      act(items, {
        icon: row.archived ? "↩" : "▣",
        label: row.archived ? "Unarchive" : "Archive",
        run: () => setMeta(row, { archived: !row.archived }, row.archived ? "Unarchived" : "Archived"),
      });
      act(items, {
        icon: "⊘",
        label: row.hidden ? "Unhide" : "Hide from inbox",
        sub: row.hidden ? undefined : "the TUI's x — no rule needed",
        run: () => setMeta(row, { hidden: !row.hidden }, row.hidden ? "Unhidden" : "Hidden"),
      });
      act(items, {
        icon: "■",
        label: "Cancel run",
        sub: row.state === "working" || row.state === "queued" ? undefined : "not running",
        disabled: !(row.state === "working" || row.state === "queued"),
        danger: true,
        run: () => cancelRun(row),
      });
    });
  }

  /** The daemon's own name for the row's group, or nothing when ungrouped. */
  function groupNameOf(row) {
    if (row.groupName) return row.groupName;
    if (!row.groupId) return undefined;
    return store.groups.find((x) => x.id === row.groupId)?.name;
  }

  function groupLabelOf(row) {
    return groupNameOf(row) || "Ungrouped";
  }

  async function setMeta(row, patch, message) {
    try {
      await api("/api/meta", { id: row.id, patch });
      toast(message);
      // Keep the open row's copy in step so its ⋯ menu shows the new state
      // without waiting for the next SSE tick.
      if (store.id === row.id) store.row = { ...store.row, ...metaToRow(patch) };
      await refresh();
    } catch (e) {
      toast(e.message, 5000);
    }
  }

  function metaToRow(patch) {
    const out = {};
    if ("pinned" in patch) out.pinned = patch.pinned;
    if ("archived" in patch) out.archived = patch.archived;
    if ("unread" in patch) out.unread = patch.unread;
    if ("hidden" in patch) out.hidden = patch.hidden;
    return out;
  }

  function renameSheet(row) {
    sheet("Rename session", (items) => {
      const p = pad(items);
      const input = field(p, {
        label: "Name",
        value: row.title,
        placeholder: "Session name",
      });
      input.focus();
      input.select();
      const save = el("button", "primary", "Save");
      save.style.width = "100%";
      const submit = async () => {
        const name = input.value.trim();
        if (!name) return toast("A name is required");
        dismissSheet();
        try {
          const r = await api("/api/rename", { id: row.id, name });
          toast(r.applied === "now" ? "Renamed" : "Renamed on the next run");
          await refresh();
          if (store.id === row.id) $("#h2").textContent = name;
        } catch (e) {
          toast(e.message, 6000);
        }
      };
      save.onclick = submit;
      input.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
      p.append(save);
    });
  }

  /** Model + thinking level, from the same `enabledModels` list the TUI's N shows. */
  async function modelSheet(row) {
    if (!store.models) {
      try { store.models = await api("/api/models"); } catch (e) { return toast(e.message, 5000); }
    }
    const data = store.models;
    if (!data?.models?.length)
      return toast("No models are enabled in settings.json", 6000);
    const current = row.model || "";
    const currentRef = current.replace(/:(off|minimal|low|medium|high|xhigh|max)$/, "");
    const currentLevel = (current.match(/:(off|minimal|low|medium|high|xhigh|max)$/) || [])[1];

    sheet("Model", (items) => {
      for (const m of data.models) {
        const isCurrent = m.reference === currentRef;
        act(items, {
          icon: isCurrent ? "●" : "○",
          label: shortModel(m.reference),
          sub: m.defaultLevel ? `default: ${m.defaultLevel}` : undefined,
          on: isCurrent,
          // A model row opens the level picker so one tap sets both; the
          // default level is one more tap away.
          run: () => levelSheet(row, m, isCurrent ? currentLevel : undefined),
        });
      }
    });
  }

  function levelSheet(row, model, currentLevel) {
    sheet(shortModel(model.reference), (items) => {
      const levels = model.levels?.length ? model.levels : ["low", "medium", "high"];
      const chosen = currentLevel || model.defaultLevel;
      act(items, {
        icon: "•",
        label: "Model default",
        sub: model.defaultLevel ? `use ${model.defaultLevel}` : undefined,
        on: !currentLevel,
        run: () => applyModel(row, model, undefined),
      });
      for (const level of levels) {
        act(items, {
          icon: level === chosen ? "●" : "○",
          label: level,
          on: level === chosen && !!currentLevel,
          run: () => applyModel(row, model, level),
        });
      }
    });
  }

  async function applyModel(row, model, level) {
    const ref = level ? `${model.reference}:${level}` : model.reference;
    try {
      await api("/api/model", { id: row.id, model: ref });
      toast(row.state === "working" ? "Model set for the next run" : "Model set");
      await refresh();
    } catch (e) {
      toast(e.message, 6000);
    }
  }

  function groupSheet(row) {
    sheet("Move to group", (items) => {
      act(items, {
        icon: row.groupId ? "○" : "●",
        label: "Ungrouped",
        on: !row.groupId,
        run: () => moveGroup(row, undefined),
      });
      for (const g of store.groups) {
        act(items, {
          icon: g.id === row.groupId ? "●" : "○",
          label: g.name,
          on: g.id === row.groupId,
          run: () => moveGroup(row, g.id),
        });
      }
      act(items, {
        icon: "＋", label: "New group…",
        run: () => createGroupSheet(row),
      });
    });
  }

  async function moveGroup(row, groupId) {
    try {
      await api("/api/group/move", { id: row.id, groupId });
      toast("Moved");
      await loadGroups();
      await refresh();
    } catch (e) {
      toast(e.message, 5000);
    }
  }

  function createGroupSheet(row) {
    sheet("New group", (items) => {
      const p = pad(items);
      const input = field(p, { label: "Name", placeholder: "e.g. PR reviews" });
      input.focus();
      const save = el("button", "primary", "Create");
      save.style.width = "100%";
      save.onclick = async () => {
        const name = input.value.trim();
        if (!name) return toast("A group name is required");
        dismissSheet();
        try {
          const r = await api("/api/group/edit", { action: "create", name });
          await loadGroups();
          if (row && r.group?.id) await moveGroup(row, r.group.id);
          else { toast("Group created"); await refresh(); }
        } catch (e) {
          toast(e.message, 5000);
        }
      };
      p.append(save);
    });
  }

  async function loadGroups() {
    try {
      const data = await api("/api/rows");
      store.groups = data.groups;
      // Another window (or the TUI) may have flipped the layout since.
      if (data.layout === "flat" || data.layout === "groups") {
        store.layout = data.layout;
      }
    } catch {
      // keep the old list
    }
  }

  async function cloneSession(row) {
    toast("Cloning…", 10_000);
    try {
      const r = await api("/api/clone", { id: row.id });
      toast("Cloned");
      await refresh();
      if (r?.id) open(r.id);
    } catch (e) {
      toast(e.message, 6000);
    }
  }

  async function cancelRun(row) {
    try {
      await api("/api/cancel", { id: row.id });
      toast("Cancelled");
      await refresh();
    } catch (e) {
      toast(e.message, 5000);
    }
  }

  /** The header menu: everything that acts on the list or the app itself. */
  function listMenu() {
    sheet("orch", (items) => {
      act(items, {
        icon: "＋", label: "New agent",
        run: () => newAgent(),
      });
      act(items, {
        icon: "◧", label: "New group…",
        run: () => createGroupSheet(undefined),
      });
      act(items, {
        icon: "⟳", label: "Refresh",
        run: () => refresh(),
      });
      // Skills and commands change when the repo, settings.json or the packages
      // do. The daemon caches the list for five minutes; this re-reads it now.
      act(items, {
        icon: "$", label: "Reload skills & commands",
        sub: store.catalog
          ? `${(store.catalog.skills || []).length} skills · ` +
            `${(store.catalog.commands || []).length} commands`
          : undefined,
        run: async () => {
          store.catalog = null;
          const data = await loadCatalog(true);
          toast(`Reloaded: ${(data.skills || []).length} skills, ` +
            `${(data.commands || []).length} commands`, 4000);
        },
      });
      if (store.groups.length) {
        act(items, {
          icon: "▤", label: "Groups",
          sub: `${store.groups.length} defined`,
          run: () => groupsSheet(),
        });
      }
      // The TUI's `s`: one persisted All-groups layout, shared by both views.
      // Offered even with no groups defined, since flat then means "no section
      // headers" — which is what a single-group list looks like anyway.
      act(items, {
        icon: "▤",
        label: store.layout === "flat" ? "Group by group" : "Flat list",
        sub: store.layout === "flat" ? "one list, group per row" : "sections per group",
        run: async () => {
          try {
            await api("/api/group/edit", {
              action: "layout",
              layout: store.layout === "flat" ? "groups" : "flat",
            });
            await refresh();
          } catch (e) {
            toast(e.message, 5000);
          }
        },
      });
      // Hiding tool calls is a display choice made per device, so it lives in
      // localStorage rather than the daemon's store: the phone can run lean
      // while the desktop keeps every step. Same idea as the TUI's ctrl+o
      // "hidden" state, without the middle collapsed step.
      act(items, {
        icon: store.tools === "hidden" ? "🔧" : "·",
        label: store.tools === "hidden" ? "Show tool calls" : "Hide tool calls",
        sub: store.tools === "hidden" ? "only replies right now" : "every step is drawn",
        run: () => setTools(store.tools === "hidden" ? "shown" : "hidden"),
      });
      // A terminal is the one thing the agent list cannot stand in for: an
      // interactive prompt (re-auth, sudo, a TUI). Hidden unless the daemon
      // was started with ORCH_WEB_ALLOW_TERM=1.
      if (store.term === true) {
        act(items, {
          icon: "▮", label: "Terminal",
          sub: "shell on the Mac",
          run: () => location.assign("/terminal"),
        });
      }
    });
  }

  function groupsSheet() {
    sheet("Groups", (items) => {
      for (const g of store.groups) {
        act(items, {
          icon: "◧",
          label: g.name,
          run: () => groupEditSheet(g),
        });
      }
      act(items, { icon: "＋", label: "New group…", run: () => createGroupSheet(undefined) });
    });
  }

  function groupEditSheet(group) {
    sheet(group.name, (items) => {
      act(items, {
        icon: "✎", label: "Rename group",
        run: () => {
          sheet("Rename group", (sub) => {
            const p = pad(sub);
            const input = field(p, { label: "Name", value: group.name });
            input.focus();
            input.select();
            const save = el("button", "primary", "Save");
            save.style.width = "100%";
            save.onclick = async () => {
              const name = input.value.trim();
              if (!name) return toast("A group name is required");
              dismissSheet();
              try {
                await api("/api/group/edit", { action: "rename", id: group.id, name });
                toast("Renamed");
                await loadGroups();
                await refresh();
              } catch (e) { toast(e.message, 5000); }
            };
            p.append(save);
          });
        },
      });
      act(items, {
        icon: "■", label: "Delete group", danger: true,
        sub: "sessions move to Ungrouped",
        run: async () => {
          try {
            await api("/api/group/edit", { action: "remove", id: group.id });
            toast("Deleted");
            await loadGroups();
            await refresh();
          } catch (e) { toast(e.message, 5000); }
        },
      });
    });
  }

  // ── new agent ────────────────────────────────────────────────────
  function newAgent() {
    sheet("New agent", (items) => {
      const p = pad(items);
      const prompt = field(p, {
        label: "Prompt",
        multiline: 4,
        placeholder: "What should this agent do?",
      });
      // The prompt is a real message body: the daemon expands `$skill` in it
      // exactly like the composer's, so offer the same list here.
      const promptComp = el("div", "comp hidden");
      prompt.after(promptComp);
      const promptCompletion = attachCompletion(prompt, promptComp);
      prompt.addEventListener("keydown", (e) => {
        if (completionKey(promptCompletion, e)) return;
        // Cmd/Ctrl+Enter starts the agent, the same shortcut the composer uses
        // to send.
        if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
          e.preventDefault();
          go.click();
        }
      });
      const cwd = field(p, {
        label: "Working directory",
        value: store.row?.cwd || "",
        placeholder: "default: the daemon's directory",
      });
      const groupRow = el("div", "row2");
      p.append(groupRow);
      const groupBox = el("div");
      const modelBox = el("div");
      groupRow.append(groupBox, modelBox);

      groupBox.append(el("label", null, "Group"));
      const groupSel = el("select");
      groupSel.append(new Option("Ungrouped", ""));
      for (const g of store.groups) groupSel.append(new Option(g.name, g.id));
      groupBox.append(groupSel);

      modelBox.append(el("label", null, "Model"));
      const modelSel = el("select");
      modelSel.append(new Option("Current default", ""));
      modelBox.append(modelSel);
      // The model list may not be loaded yet on a cold start; fill it in place.
      (async () => {
        try {
          store.models ||= await api("/api/models");
          for (const m of store.models?.models || []) {
            modelSel.append(new Option(shortModel(m.reference), m.reference));
          }
        } catch { /* the default is still usable */ }
      })();

      const go = el("button", "primary", "Start agent");
      go.style.width = "100%";
      go.onclick = async () => {
        const text = prompt.value.trim();
        if (!text) return toast("A prompt is required");
        dismissSheet();
        toast("Starting…");
        try {
          const r = await api("/api/new", {
            prompt: text,
            cwd: cwd.value.trim() || undefined,
            groupId: groupSel.value || undefined,
            model: modelSel.value || undefined,
          });
          toast("Started");
          await refresh();
          if (r?.id) open(r.id);
        } catch (e) {
          toast(e.message, 6000);
        }
      };
      p.append(go);
      prompt.focus();
    });
  }

  // ── composer completions ──────────────────────────────────────────
  //
  // The TUI opens a fuzzy list for `$skill`, `/command` and `@[session]` and
  // inserts a token in place, leaving what you typed intact. The phone should
  // behave the same way, so this is a small autocomplete over the textarea
  // rather than a picker that replaces the message.
  //
  // Inserted tokens are exactly what the TUI inserts, because both are expanded
  // on the request side by the same extensions:
  //   $name        inline-skills expands it on the way to the model
  //   @[id]        session-mention quotes that transcript, same as the TUI
  //   /skill:name  pi itself expands it, in a background run or a TUI turn
  // Every other `/command` is an interactive extension command that a `--mode
  // json` run does not execute, so those are offered only as a warning.

  const COMPLETION_LIMIT = 30;

  /** Fuzzy subsequence match, ranked: prefix beats word start beats scattered. */
  function fuzzyScore(text, query) {
    if (!query) return 0;
    const t = text.toLowerCase();
    const q = query.toLowerCase();
    const direct = t.indexOf(q);
    if (direct === 0) return 1000 - text.length;
    if (direct > 0) {
      const boundary = /[\s:._/-]/.test(t[direct - 1]);
      return (boundary ? 700 : 400) - direct - text.length / 100;
    }
    // Subsequence, with a bonus for each character landing on a boundary.
    let at = 0;
    let score = 0;
    for (const ch of q) {
      const hit = t.indexOf(ch, at);
      if (hit < 0) return -1;
      const boundary = hit === 0 || /[\s:._/-]/.test(t[hit - 1]);
      score += boundary ? 6 : 1;
      at = hit + 1;
    }
    return score - text.length / 100;
  }

  /** Rank `items` by `query`; `haystacks` maps an item to what is searchable. */
  function rank(items, query, haystacks) {
    if (!query) return items.slice();
    const scored = [];
    for (const item of items) {
      let best = -1;
      for (const hay of haystacks(item)) {
        const s = fuzzyScore(hay, query);
        if (s > best) best = s;
      }
      if (best >= 0) scored.push({ item, score: best });
    }
    scored.sort((a, b) => b.score - a.score);
    return scored.map((s) => s.item);
  }

  async function loadCatalog(force = false) {
    if (store.catalog && !force) return store.catalog;
    // The daemon builds the catalog in a one-shot child (pi's own discovery),
    // which takes a few hundred ms on a cold start. Ask again while that is in
    // flight instead of caching an empty answer.
    for (let attempt = 0; attempt < 8; attempt++) {
      try {
        const data = await api(`/api/catalog${force && !attempt ? "?refresh=1" : ""}`);
        if (data.loading && !(data.skills || []).length && !(data.commands || []).length) {
          await new Promise((r) => setTimeout(r, 350));
          continue;
        }
        store.catalog = data;
        return data;
      } catch (e) {
        store.catalog = { skills: [], prompts: [], commands: [], error: e.message };
        return store.catalog;
      }
    }
    store.catalog = { skills: [], prompts: [], commands: [], error: "still building" };
    return store.catalog;
  }

  /**
   * Group scope for an `@` token, mirroring the TUI's three triggers:
   *   `@[`   every session, whatever its group
   *   `@g[`  this session's group, archived hidden
   *   `@ga[` this session's group, archived included
   * The popup's dropdown overrides the trigger for the rest of that token.
   */
  function mentionScope(trigger) {
    if (trigger === "@[") return "all";
    return trigger === "@ga[" ? "group-archived" : "group";
  }

  /** Sessions for `@[`, scoped to a group; refreshed per popup, not cached. */
  async function loadMentions(scope) {
    const params = new URLSearchParams();
    if (store.id) params.set("from", store.id);
    if (scope === "all") params.set("group", "all");
    else if (scope === "group" || scope === "group-archived") {
      // `self` is explicit: an ungrouped session must get no rows, not every
      // row. `@ga[` is the only one that wants archived sessions too.
      params.set("group", "self");
      if (scope === "group-archived") params.set("archived", "1");
    } else if (scope) params.set("group", scope);
    try {
      const data = await api(`/api/mentions?${params}`);
      store.mentions = data;
      return data;
    } catch (e) {
      return { mentions: [], groups: store.mentions?.groups || [], error: e.message };
    }
  }

  /**
   * What the caret is looking at: a `$skill`, a `/command`, or an `@[session]`
   * token being typed. Returns null when the composer is not in one of those
   * positions, which is what keeps ordinary typing free of a popup.
   */
  function completionContext(box) {
    const before = box.value.slice(0, box.selectionStart);

    // `/command` is a whole-message thing (pi only expands it at the start).
    // No trailing-whitespace trim: once you type a space the argument has
    // begun and the command list must get out of the way.
    const slash = /^\/([\w:-]*)$/.exec(before);
    if (slash) return { kind: "command", query: slash[1], start: 0, end: before.length };

    // `$skill` anywhere; unknown names like $HOME are simply not matches.
    const dollar = /(^|[\s([{<"'`])\$([\w.:-]*)$/.exec(before);
    if (dollar) {
      const start = before.length - dollar[2].length - 1;
      return { kind: "skill", query: dollar[2], start, end: before.length };
    }

    // `@[query`, `@g[query]` and `@ga[query]` mirror the TUI triggers, and so
    // does a bare `@query`: the TUI expects a real keyboard for `@[`, which is
    // three taps on glass, so the phone opens on the `@` and still inserts the
    // full `@[id]` token when you pick. `@` inside a word is left alone, so an
    // email address does not open a list.
    const at = /(^|[\s([{<"'`])(@(?:ga|g)?\[)([^\]\n]*)$/.exec(before);
    if (at) {
      const start = before.length - at[3].length - at[2].length;
      return {
        kind: "mention", trigger: at[2], token: at[2], query: at[3],
        start, end: before.length,
      };
    }
    const bare = /(^|[\s([{<"'`])@([\w.:-]*)$/.exec(before);
    if (bare) {
      const start = before.length - bare[2].length - 1;
      return {
        kind: "mention", trigger: "@[", token: `@${bare[2]}`,
        query: bare[2], start, end: before.length,
      };
    }
    return null;
  }

  /**
   * One autocomplete popup, bound to one text box.
   *
   * The composer is not the only place these tokens get typed: the new-agent
   * prompt takes the same `$skill` and the daemon expands it the same way, so
   * this is a factory rather than a singleton watching `#input`.
   */
  function makeCompletion(box, pop) {
    const api = {
      /** Current rows for the open popup, so ↑/↓/Enter can act without a query. */
      items: [],
      index: 0,
      ctx: null,
      scope: null,
      seq: 0,
      quiet: false,

      close() {
        if (pop) { pop.classList.add("hidden"); pop.textContent = ""; }
        api.items = [];
        api.index = 0;
        api.ctx = null;
        // The group picker is per-popup: a fresh `@[` goes back to its trigger's
        // scope instead of inheriting the last choice.
        api.scope = null;
      },

      /** Re-run the current query (after the catalog or rows changed). */
      refresh() {
        if (api.ctx && !api.quiet) void api.update();
      },

      /** True while the popup owns the arrow/Tab/Enter keys. */
      isOpen() {
        return api.items.length > 0;
      },

      async update() {
        const ctx = completionContext(box);
        if (!ctx) return api.close();
        // A dropdown choice belongs to the token it was made for: retyping `@[`
        // as `@g[` is asking a different question.
        if (api.ctx && ctx.kind === "mention" &&
            api.ctx.token !== ctx.token && ctx.query === "") {
          api.scope = null;
        }
        if (api.ctx && ctx.kind !== "mention") api.scope = null;
        api.ctx = ctx;
        api.seq += 1;
        const seq = api.seq;

        let items = [];
        let title = "";
        let empty = "";
        let completedScope = null;

        if (ctx.kind === "skill") {
          const catalog = await loadCatalog();
          const skills = catalog.skills || [];
          const matched = rank(skills, ctx.query, (s) => [s.name, s.description || ""]);
          items = matched.slice(0, COMPLETION_LIMIT).map((s) => ({
            name: `$${s.name}`,
            desc: s.description || "",
            insert: `$${s.name}`,
          }));
          title = "Skills";
          empty = catalog.error
            ? "Skill list unavailable"
            : skills.length ? "No matching skill" : "No skills configured";
        } else if (ctx.kind === "command") {
          const catalog = await loadCatalog();
          const commands = catalog.commands || [];
          const prompts = catalog.prompts || [];
          // Ranked together, so an exact name wins over a description substring.
          const scored = [];
          for (const c of commands) {
            const s = Math.max(...[c.name, c.description || ""].map((h) => fuzzyScore(h, ctx.query)));
            if (s < 0) continue;
            scored.push({
              name: `/${c.name}`,
              desc: c.description || "",
              // `/skill:name` is expanded by pi itself in any mode. Every other
              // registered command runs with `ctx.mode === "json"` in a
              // background child, and pi-kit's handlers all require "tui", so
              // they are listed for parity but do nothing there.
              insert: `/${c.name}`,
              warn: !c.executesInRun,
              score: s,
            });
          }
          for (const p of prompts) {
            const s = Math.max(...[p.name, p.description || ""].map((h) => fuzzyScore(h, ctx.query)));
            if (s < 0) continue;
            scored.push({
              name: `/${p.name}`,
